  <style>
:root {

}

.features { background: #fff; }
.feature-item {

    height: 30px;

}

.newsletter { background: var(--brand-light); }

}

}
.footer-social a:hover { color: #fff; }
.footer-line { border-color: #1e293b; opacity: 1; }

.cat-card {
